[package]
name = "medusa-tui"
version = "0.3.1"
edition = "2024"
rust-version = "1.90"
description = "Medusa terminal UI coding harness"
license = "MIT"
repository = "https://github.com/jayasuryajsk/Medusa"
homepage = "https://github.com/jayasuryajsk/Medusa"
readme = "../../README.md"
keywords = ["agent", "coding-agent", "terminal", "tui"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "medusa"
path = "src/main.rs"

[dependencies]
color-eyre = "0.6.5"
arboard = "3.6.1"
crossterm = "0.29.0"
image = { version = "0.25.8", default-features = false, features = ["png", "jpeg"] }
medusa-core = { version = "0.3.1", path = "../medusa-core" }
ratatui = "0.30.2"
ratatui-image = { version = "11.0.5", default-features = false, features = ["crossterm"] }
rpassword = "7.4.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
syntect = { version = "5.3.0", default-features = false, features = ["default-fancy"] }
ansi-to-tui = "8.0.1"
